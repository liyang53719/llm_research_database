name: unpack llm block owner sequence v6

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/unpack_llm_block_v6.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch staged payload blob and extract
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_BLOB: 7adafc855e9ffd9cc2d62c0c1f4f71d0e9f56011
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${PAYLOAD_BLOB}"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}" \
            | jq -r '.content' \
            | tr -d '\n' \
            | base64 -d > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.zip
          unzip -t /tmp/payload.zip
          unzip -q /tmp/payload.zip -d /tmp/extracted
          test -d /tmp/extracted/llm_block_vs_owner_sequence_v6
          rm -rf llm_block_vs_owner_sequence_v6
          cp -a /tmp/extracted/llm_block_vs_owner_sequence_v6 ./
          find llm_block_vs_owner_sequence_v6 -type f -print | sort
      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llm_block_vs_owner_sequence_v6
          test "$(git diff --cached --name-only | wc -l)" -gt 0
          git commit -m "Add LLM block vs owner sequence v6 diagrams"
          git push origin HEAD:master
